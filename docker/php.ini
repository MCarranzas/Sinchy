; SINCHI WAYRA - ajustes de PHP para el contenedor de produccion.
;
; Las exportaciones (Excel con PhpSpreadsheet, PDF con dompdf) son sincronas y
; consumen memoria del proceso; con datos reales conviene 512 MB. En un plan
; con poca RAM, bajar a 256M y evitar reportes de rangos enormes.

memory_limit = 512M
upload_max_filesize = 12M
post_max_size = 12M
max_execution_time = 120
max_input_time = 120

; Popula $_ENV ademas de $_SERVER/getenv, que es de donde Laravel lee las
; variables de entorno.
variables_order = "EGPCS"

date.timezone = America/La_Paz

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
